name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # 1) 代码质量门禁：lint + 单元测试，不通过就不构建镜像
  # ------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff check
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  # ------------------------------------------------------------------
  # 2) 构建并推送镜像到 GitHub Container Registry (ghcr.io)
  #    镜像名：ghcr.io/<owner>/<repo>  （统一转小写）
  # ------------------------------------------------------------------
  docker:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: vars
        run: echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=AI 拍纸立得 后端
            org.opencontainers.image.description=微信小程序「AI 拍纸立得」FastAPI 后端：多图合成 A4 PDF

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false

      # 用刚推上去的镜像做一次真实启动冒烟测试，防止"构建成功但镜像跑不起来"
      - name: Smoke test the pushed image
        run: |
          set -e
          IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "Testing $IMAGE"
          docker run -d --name aipdf-smoke -p 8000:8000 "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          docker logs aipdf-smoke || true
          docker rm -f aipdf-smoke >/dev/null 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "::error::镜像启动后 /health 未就绪"
            exit 1
          fi
          echo "✅ 冒烟测试通过"

      # 给仓库主页写一个构建摘要，方便在 Actions 页面直接看到镜像地址
      - name: Summary
        run: |
          {
            echo "### 🐳 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "服务器部署："
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
